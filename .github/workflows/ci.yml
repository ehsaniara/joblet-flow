name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  GO_VERSION: '1.24'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - run: go mod download

      - run: go vet ./...

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Run tests
        run: go test -v -race -count=1 -coverprofile=coverage.out ./...

      - run: go tool cover -func=coverage.out

      - name: Lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  build:
    name: Build ${{ matrix.arch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [ amd64, arm64 ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install rpmbuild
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build packages (engine build + arch verification inside)
        run: |
          chmod +x scripts/build-deb.sh scripts/build-rpm.sh
          ./scripts/build-deb.sh ${{ matrix.arch }}
          RPM_ARCH=x86_64; [ "${{ matrix.arch }}" = "arm64" ] && RPM_ARCH=aarch64
          ./scripts/build-rpm.sh "$RPM_ARCH"

      - name: Inspect packages
        run: |
          dpkg-deb --info joblet-flow_*_${{ matrix.arch }}.deb
          rpm -qip joblet-flow-*.rpm

      - uses: actions/upload-artifact@v4
        with:
          name: joblet-flow-packages-${{ matrix.arch }}
          path: |
            joblet-flow_*_${{ matrix.arch }}.deb
            joblet-flow-*.rpm
          retention-days: 7
